<svg class="game-icon" viewBox="0 0 24 24" width="28" height="28" aria-hidden="true">
  @switch (name()) {
    @case ('code') {
      <!-- </> : CodeGuessr -->
      <path d="M9 6 4 12l5 6" />
      <path d="M15 6l5 6-5 6" />
    }
    @case ('commit') {
      <!-- nodo de commit sobre una rama: CommitGuessr -->
      <line x1="12" y1="2" x2="12" y2="8" />
      <line x1="12" y1="16" x2="12" y2="22" />
      <circle cx="12" cy="12" r="4" />
    }
    @case ('ui') {
      <!-- ventana de navegador: UIGuessr -->
      <rect x="3" y="5" width="18" height="14" rx="2" />
      <line x1="3" y1="9" x2="21" y2="9" />
      <circle class="dot" cx="6.5" cy="7" r="0.6" />
      <circle class="dot" cx="8.5" cy="7" r="0.6" />
    }
    @case ('ai') {
      <!-- chip/circuito con destello: AIGuessr -->
      <rect x="7" y="7" width="10" height="10" rx="1.5" />
      <line x1="12" y1="2" x2="12" y2="7" />
      <line x1="12" y1="17" x2="12" y2="22" />
      <line x1="2" y1="12" x2="7" y2="12" />
      <line x1="17" y1="12" x2="22" y2="12" />
      <circle cx="12" cy="12" r="1.6" />
    }
    @case ('stack') {
      <!-- capas de stack trace: StackGuessr -->
      <path d="M12 3 3 8l9 5 9-5-9-5Z" />
      <path d="M3 13l9 5 9-5" />
    }
    @case ('terminal') {
      <!-- prompt de terminal: TerminalGuessr -->
      <rect x="3" y="4" width="18" height="16" rx="2" />
      <path d="M7 10l3 2.5L7 15" />
      <line x1="12" y1="15" x2="16" y2="15" />
    }
  }
</svg>
